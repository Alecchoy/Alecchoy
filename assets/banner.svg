  <text x="430" y="25" font-family="SF Mono, Fira Code, Menlo, monospace" font-size="12" fill="#8b949e" text-anchor="middle">alec@choy — zsh</text>
  <g font-family="SF Mono, Fira Code, Menlo, monospace" font-size="15">
    <text x="28" y="76"><tspan fill="#7ee787">➜</tspan><tspan fill="#c9d1d9" dx="10">whoami</tspan></text>
    <text x="28" y="102" fill="#8b949e">alec — builds AI that talks to your parents</text>

    <text x="28" y="146"><tspan fill="#7ee787">➜</tspan><tspan fill="#c9d1d9" dx="10">ls ~/ships</tspan></text>
    <text x="28" y="172"><tspan fill="#79c0ff">yelo/</tspan><tspan fill="#c9d1d9" dx="18">AI voice companion for elderly, limited-English parents</tspan></text>
    <text x="94" y="198" fill="#8b949e">→ <tspan fill="#7ee787">live on the App Store</tspan> — built for my own mom and dad</text>
    <text x="94" y="224" fill="#8b949e">→ speaks the first sentence while the model is still thinking</text>
    <text x="94" y="250" fill="#8b949e">→ 15 languages · native Swift iOS · Claude routing · Postgres RLS</text>
    <text x="94" y="276" fill="#8b949e">→ <tspan fill="#79c0ff">yelofamily.com</tspan></text>

    <text x="28" y="320"><tspan fill="#7ee787">➜</tspan><tspan fill="#c9d1d9" dx="10">grep -r "day job" ~/jfrog</tspan></text>
    <text x="28" y="346" fill="#8b949e">P1/P2 enterprise escalations — auth (OIDC/SAML/OAuth) &amp; supply-chain security</text>
    <text x="28" y="372" fill="#8b949e">agentic case triage on Claude Code · SUP CLI — the team's default triage step</text>

    <text x="28" y="416"><tspan fill="#7ee787">➜</tspan><tspan fill="#c9d1d9" dx="10">cat /etc/fun-fact</tspan></text>
    <text x="28" y="442" fill="#ffa657">drummed for Kanye West. not a typo.</text>

    <text x="28" y="486"><tspan fill="#7ee787">➜</tspan></text>
    <rect x="48" y="472" width="9" height="17" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
